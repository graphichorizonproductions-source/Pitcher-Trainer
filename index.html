<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a1a">
<title>Worship Team Pitch Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#080a1a;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.12);--text:#f3f5ff;--muted:#9aa3d0;--violet:#7c5cff;--blue:#3fa9ff;--gold:#ffc857;--green:#2ee6a6;--red:#ff5d73;--yel:#ffd166;--grad:linear-gradient(135deg,#7c5cff 0%,#3fa9ff 100%);--radius:22px}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--ink);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
body::before{width:540px;height:540px;background:#5436e0;top:-180px;left:-140px;animation:drift 19s ease-in-out infinite alternate}
body::after{width:500px;height:500px;background:#0b78cf;bottom:-190px;right:-150px;animation:drift 23s ease-in-out -9s infinite alternate}
@keyframes drift{to{transform:translate(90px,70px) scale(1.18)}}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 118px;position:relative}
.ic{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}
h1,h2,h3{font-family:'Sora','Inter',sans-serif;letter-spacing:-.3px}
h1{font-size:32px;line-height:1.15}
h2{font-size:26px;line-height:1.2;margin:2px 0 8px}
h3{font-size:17px;margin-bottom:8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:15px}
.eyebrow{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:1.4px}
.alt{color:var(--muted);font-weight:500}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;animation:rise .6s both}
.brand{display:flex;align-items:center;gap:10px;font:700 17px 'Sora',sans-serif;letter-spacing:-.2px;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 22px rgba(124,92,255,.5);flex:none}
.mark .ic{width:19px;height:19px;color:#fff}
.tools{display:flex;align-items:center;gap:7px}
.icbtn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s;flex:none}
.icbtn:hover{background:var(--glass2);transform:translateY(-1px)}
.icbtn .ic{width:18px;height:18px}
.icbtn.off{color:var(--muted)}
body.speaking #voiceBtn{background:rgba(124,92,255,.35);border-color:var(--violet);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(124,92,255,.18)}}
.lang{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 12px 'Inter',sans-serif;padding:7px 10px;border-radius:9px;cursor:pointer;transition:.25s}
.lang button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.4)}

/* entrance animation */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
#view>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}#view>*:nth-child(6){animation-delay:.25s}#view>*:nth-child(7){animation-delay:.3s}#view>*:nth-child(8){animation-delay:.35s}#view>*:nth-child(9){animation-delay:.4s}#view>*:nth-child(10){animation-delay:.45s}#view>*:nth-child(11){animation-delay:.5s}#view>*:nth-child(12){animation-delay:.55s}
.grid>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(2){animation-delay:.1s}.grid>*:nth-child(3){animation-delay:.18s}.grid>*:nth-child(4){animation-delay:.26s}

/* surfaces */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.28)}
.hero{background:linear-gradient(150deg,rgba(124,92,255,.24),rgba(63,169,255,.08));border-color:rgba(124,92,255,.38)}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(124,92,255,.25);border:1px solid rgba(124,92,255,.5);font:700 12px 'Inter';letter-spacing:1px;text-transform:uppercase}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--glass2);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px 20px;font:700 16px 'Inter',sans-serif;cursor:pointer;transition:transform .2s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 28px rgba(92,110,255,.45)}
.btn.primary::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.34) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.gold{background:linear-gradient(135deg,#ffc857,#ff9f43);color:#2a1a00;border-color:transparent;box-shadow:0 10px 28px rgba(255,167,67,.32)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:13px}
.btn.big{width:100%;padding:17px;font-size:17px;margin-top:12px}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row .btn{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:18px;padding:16px 18px;color:var(--text);font:inherit;cursor:pointer;margin:11px 0;transition:.25s}
.opt b{display:block;font:700 18px 'Sora',sans-serif}
.opt small{color:var(--muted);font-size:14px}
.opt:hover{transform:translateY(-2px);border-color:var(--violet);background:rgba(124,92,255,.17)}
.opt.on{border-color:var(--violet);background:rgba(124,92,255,.24)}
input[type=text]{width:100%;padding:15px 16px;border-radius:15px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);font:600 18px 'Inter',sans-serif;margin:10px 0;outline:none;transition:.25s}
input[type=text]:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,92,255,.22)}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;justify-content:space-around;background:rgba(18,22,54,.74);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:24px;padding:7px;box-shadow:0 14px 44px rgba(0,0,0,.5);z-index:20;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.tabs.hide{transform:translate(-50%,150%);opacity:0;pointer-events:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--muted);font:600 11px 'Inter',sans-serif;padding:8px 2px;border-radius:17px;cursor:pointer;transition:.3s}
.tabs button .ic{width:21px;height:21px;transition:transform .3s}
.tabs button.on{color:#fff;background:rgba(124,92,255,.3)}
.tabs button.on .ic{transform:translateY(-2px) scale(1.12);color:#8fc9ff}

/* home */
.greet{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:6px 0 4px}
.ringbox{position:relative;width:84px;height:84px;flex:none}
.ringbox svg{width:84px;height:84px;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
.rg-fg{fill:none;stroke:#6aa8ff;stroke-width:7;stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1) .3s;filter:drop-shadow(0 0 6px rgba(106,168,255,.6))}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font:700 16px 'Sora',sans-serif}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:14px 0;padding:20px 22px;border:0;border-radius:24px;background:var(--grad);color:#fff;text-align:left;cursor:pointer;box-shadow:0 16px 44px rgba(92,110,255,.5);position:relative;overflow:hidden;font:inherit;transition:transform .25s}
.cont:hover{transform:translateY(-3px)}
.cont::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4.5s ease-in-out 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(130%)}}
.cont small{display:block;font:700 12px 'Inter';text-transform:uppercase;letter-spacing:1.4px;opacity:.85}
.cont b{display:block;font:700 21px 'Sora',sans-serif;margin-top:2px}
.cont .ic{width:28px;height:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px 14px;text-align:left;cursor:pointer;color:var(--text);font:700 15px 'Inter',sans-serif;backdrop-filter:blur(12px);transition:.25s}
.tile:hover{transform:translateY(-4px);border-color:rgba(124,92,255,.55);background:var(--glass2)}
.tile .chip-ic{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;margin-bottom:12px;box-shadow:0 8px 22px rgba(92,110,255,.4);transition:transform .3s}
.tile:hover .chip-ic{transform:rotate(-8deg) scale(1.08)}
.tile .chip-ic .ic{width:22px;height:22px;color:#fff}
.tile small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}

/* levels */
.lv{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:10px 0;width:100%;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;backdrop-filter:blur(12px)}
.lv:hover{transform:translateX(5px);background:var(--glass2);border-color:rgba(124,92,255,.5)}
.lv.locked{opacity:.42;cursor:not-allowed}.lv.locked:hover{transform:none;background:var(--glass);border-color:var(--line)}
.lv .num{width:46px;height:46px;border-radius:15px;background:var(--grad);display:grid;place-items:center;font:700 19px 'Sora',sans-serif;flex:none;color:#fff;box-shadow:0 6px 18px rgba(92,110,255,.42)}
.lv.locked .num{background:rgba(255,255,255,.08);box-shadow:none;color:var(--muted)}
.lv.passed .num{background:linear-gradient(135deg,#2ee6a6,#13b886);box-shadow:0 6px 18px rgba(46,230,166,.35)}
.lv .nm{flex:1;font-weight:700;min-width:0}
.lv .nm small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.stars-row{display:inline-flex;gap:3px}
.star{width:18px;height:18px;fill:transparent;stroke:#5a6296;stroke-width:2;stroke-linejoin:round}
.star.on{fill:var(--gold);stroke:var(--gold);animation:pop .65s cubic-bezier(.3,1.7,.5,1) both;filter:drop-shadow(0 0 6px rgba(255,200,87,.6))}
.stars-row.lg .star{width:44px;height:44px}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.09);border-radius:12px;padding:6px 13px;font-weight:700;border:1px solid transparent;transition:.25s}
.chip.on{border-color:var(--gold);color:var(--gold);transform:translateY(-3px);background:rgba(255,200,87,.12)}
.how{display:flex;flex-direction:column;gap:14px}
.how .st{display:flex;gap:14px;align-items:flex-start}
.how .st i{flex:none;width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font:700 14px 'Sora',sans-serif;font-style:normal}
.how .st span{padding-top:3px}

/* run screens */
.runhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.badge{display:inline-block;padding:5px 13px;border-radius:999px;font:700 12px 'Inter';text-transform:uppercase;letter-spacing:1.2px}
.badge.practice{background:rgba(63,169,255,.25);border:1px solid rgba(63,169,255,.6);color:#a9d8ff}
.badge.test{background:rgba(255,93,115,.22);border:1px solid rgba(255,93,115,.6);color:#ffb3be}
.lvname{font-weight:600;color:var(--muted);font-size:14px;text-align:right;flex:1}
.instr{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#d7dcff;padding:14px 16px}
.stage{text-align:center;transition:background .3s;position:relative}
.status{font:700 18px 'Sora',sans-serif;min-height:28px;color:var(--gold)}
.orb{position:relative;width:176px;height:176px;margin:10px auto 6px;display:grid;place-items:center}
.orb::before,.orb::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(124,92,255,.6);opacity:0}
.core{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#a590ff,#4b34c9 72%);box-shadow:0 0 44px rgba(124,92,255,.55),inset 0 -8px 24px rgba(0,0,0,.25);display:grid;place-items:center;font:700 40px 'Sora',sans-serif;transition:background .4s,box-shadow .4s;position:relative;z-index:1}
.core .ic{width:52px;height:52px}
.stage.hear .orb::before{animation:ringout 1.9s ease-out infinite}
.stage.hear .orb::after{animation:ringout 1.9s ease-out .95s infinite}
.stage.sing .core{background:radial-gradient(circle at 30% 25%,#66f3c5,#0f9a76 72%);box-shadow:0 0 56px rgba(46,230,166,.55),inset 0 -8px 24px rgba(0,0,0,.22);animation:breathe 1.5s ease-in-out infinite}
.stage.sing .orb::before{border-color:rgba(46,230,166,.7);animation:ringout 1.3s ease-out infinite}
.stage.sing .orb::after{border-color:rgba(46,230,166,.7);animation:ringout 1.3s ease-out .65s infinite}
@keyframes ringout{from{transform:scale(.72);opacity:.95}to{transform:scale(1.4);opacity:0}}
@keyframes breathe{50%{transform:scale(1.06)}}
.dots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:.35s}
.dots i.on{background:var(--gold);transform:scale(1.5);box-shadow:0 0 12px var(--gold)}
.meter{position:relative;height:60px;border-radius:30px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin:16px 0 6px;overflow:hidden;box-shadow:inset 0 2px 12px rgba(0,0,0,.4)}
.meter::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.07) calc(10% - 1px) 10%)}
.zone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(46,230,166,.28),rgba(46,230,166,.12));border-left:2px solid rgba(46,230,166,.7);border-right:2px solid rgba(46,230,166,.7);transition:width .3s}
.dot{position:absolute;top:50%;left:50%;width:32px;height:32px;border-radius:50%;background:#8189b8;transform:translate(-50%,-50%);transition:left .09s linear,background .2s,box-shadow .2s;opacity:.28}
.dot.ok{background:var(--green);box-shadow:0 0 0 6px rgba(46,230,166,.2),0 0 28px var(--green)}
.dot.near{background:var(--yel);box-shadow:0 0 18px rgba(255,209,102,.6)}
.dot.far{background:var(--red);box-shadow:0 0 18px rgba(255,93,115,.6)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.hint{font:700 20px 'Sora',sans-serif;min-height:30px;margin-top:10px}
.det{color:var(--muted);font-size:14px;margin-top:4px}
.holdbar{height:8px;border-radius:4px;background:rgba(0,0,0,.35);margin-top:14px;overflow:hidden}
.holdbar i,.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f43);transition:width .1s linear;border-radius:4px;box-shadow:0 0 12px rgba(255,200,87,.5)}
.bar{height:10px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0}
.bar i{background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(92,140,255,.6)}
.statrow{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:14px}
.flash-ok{animation:fok .8s}.flash-bad{animation:fbad .8s}
@keyframes fok{0%{background:rgba(46,230,166,.38);transform:scale(1.015)}100%{background:var(--glass);transform:none}}
@keyframes fbad{0%{background:rgba(255,93,115,.32);transform:translateX(-6px)}25%{transform:translateX(6px)}50%{transform:translateX(-4px)}75%{transform:translateX(3px)}100%{background:var(--glass);transform:none}}
.demo{background:rgba(255,167,67,.16);border:1px solid rgba(255,167,67,.5);color:#ffd9a3;border-radius:14px;padding:8px 12px;font-weight:700;font-size:12.5px;text-align:center;margin-bottom:10px}
.earbtns{display:flex;gap:12px;margin:16px 0 4px}
.earbtns .btn{flex:1;font:700 20px 'Sora',sans-serif;padding:24px 10px;flex-direction:column;gap:8px}
.earbtns .btn .ic{width:28px;height:28px}

/* result */
.big-ic{width:84px;height:84px;border-radius:28px;background:var(--grad);display:grid;place-items:center;margin:4px auto 12px;box-shadow:0 18px 50px rgba(92,110,255,.5);animation:float 3.2s ease-in-out infinite}
.big-ic.good{background:linear-gradient(135deg,#2ee6a6,#13b886);box-shadow:0 18px 50px rgba(46,230,166,.45)}
.big-ic .ic{width:42px;height:42px;color:#fff}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.score{font:700 68px 'Sora',sans-serif;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* onboarding + tour */
.ob-dots,.wdots{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.ob-dots i,.wdots i{height:6px;width:30px;border-radius:3px;background:rgba(255,255,255,.14);transition:.45s}
.ob-dots i.on,.wdots i.on{background:var(--grad);width:54px}
.ob-dots i.done,.wdots i.done{background:var(--green)}
.slide{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
.slide.back{animation-name:slideBack}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.tour-ic{width:96px;height:96px;border-radius:32px;background:var(--grad);display:grid;place-items:center;margin:6px auto 18px;box-shadow:0 18px 54px rgba(92,110,255,.55);animation:float 3.4s ease-in-out infinite}
.tour-ic .ic{width:46px;height:46px;color:#fff}
.tour-body{font-size:17px;color:#dfe3ff;text-align:center}
.demo-meter .dot{animation:sweep 5s ease-in-out infinite;opacity:1}
@keyframes sweep{0%{left:14%;background:var(--red)}28%{left:34%;background:var(--yel)}50%{left:50%;background:var(--green);box-shadow:0 0 0 6px rgba(46,230,166,.2),0 0 28px var(--green)}72%{left:66%;background:var(--yel)}88%{left:86%;background:var(--red)}100%{left:14%;background:var(--red)}}

/* warm-up */
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fa3ff,#3a2fb5 75%);margin:20px auto;transition:transform 4s ease-in-out,box-shadow 4s;box-shadow:0 0 40px rgba(124,92,255,.4)}
.breath.big{transform:scale(1.45);box-shadow:0 0 90px rgba(124,92,255,.7)}
.track{position:relative;height:200px;width:62px;margin:12px auto;border-radius:31px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.ball{position:absolute;left:50%;bottom:7px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--grad);box-shadow:0 0 24px rgba(92,140,255,.8);transition:bottom 4s ease-in-out}
.ball.up{bottom:151px}
.hum-ic{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;margin:14px auto;background:radial-gradient(circle at 35% 30%,#8fa3ff,#3a2fb5 75%)}
.hum-ic .ic{width:50px;height:50px}
.hum-ic.pulse{animation:breathe 1.2s ease-in-out infinite}

/* theory */

@keyframes coachOut{to{opacity:0;transform:scale(1.03)}}
.coach .arrow{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#ff9a5c,#ff5d73);display:grid;place-items:center;box-shadow:0 16px 44px rgba(255,93,115,.5)}

.coach.steady .arrow,.coach.hold .arrow{animation:wiggle .7s ease-in-out infinite}
.coach p{font:700 19px 'Sora',sans-serif;line-height:1.35;max-width:300px}
@keyframes bobUp{0%,100%{transform:translateY(8px)}50%{transform:translateY(-16px)}}
@keyframes bobDown{0%,100%{transform:translateY(-8px)}50%{transform:translateY(16px)}}
@keyframes pulseMic{0%,100%{transform:scale(1);box-shadow:0 16px 44px rgba(255,93,115,.5)}50%{transform:scale(1.12);box-shadow:0 0 0 18px rgba(255,93,115,.18)}}

.footer{margin-top:24px;text-align:center;color:var(--muted);font-size:13px}

  if (rms < 0.012) return null;

  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }

  }
  const cm = new Float32Array(tauMax + 1);
  cm[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = run === 0 ? 1 : d[tau] * tau / run; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {

}
async function playTone(freq, dur = 1, vol = 0.25) {

/* ---------- microphone ---------- */
let stream = null, analyser = null, sbuf = null, micOK = false;
async function startMic() {
  if (micOK) return true;
  try {
    const ac = audio();
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 4096;
    src.connect(analyser);
    sbuf = new Float32Array(analyser.fftSize);
    micOK = true;
    return true;
  } catch (e) { return false; }
}
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function readPitch() {
  if (muted || speakN > 0) return null;
  if (demo.on) {
    if (!demo.freq) return null;
    const el = (performance.now() - demo.t0) / 1000;
    if (el < 0.9) return null;
    const err = demo.miss ? demo.err0 : demo.err0 * Math.exp(-(el - 0.9) * 2.5) + gauss() * 7;
    return demo.freq * Math.pow(2, err / 1200);
  }
  if (!micOK) return null;
  analyser.getFloatTimeDomainData(sbuf);
  return yin(sbuf, AC.sampleRate);
}
function demoTarget(freq, miss) {
  demo.freq = freq; demo.t0 = performance.now();
  demo.miss = miss === undefined ? Math.random() < 0.22 : miss;
  demo.err0 = demo.miss ? (Math.random() < .5 ? -1 : 1) * (130 + Math.random() * 60) : (Math.random() < .5 ? -1 : 1) * (30 + Math.random() * 40);
}
async function ensureMic() {
  if (demo.on) return true;
  const ok = await startMic();
  if (!ok) { const b = $('#micbox'); if (b) b.classList.remove('hidden'); }
  return ok;
}

function meterHTML() {
  return `<div class="meter"><div class="zone" id="m-zone"></div><div class="dot" id="m-dot"></div></div>
  <div class="ends"><span>${tr('tooLow')}</span><span>${tr('tooHigh')}</span></div>
  <div class="hint" id="m-hint">${tr('hintNone')}</div>
  <div class="det"><span>${tr('youSing')}: </span><b id="m-det">–</b></div>
  <div class="holdbar"><i id="m-hold"></i></div>`;
}
function updateMeter(err, tol, hf, f) {
  const dot = $('#m-dot'); if (!dot) return;
  $('#m-zone').style.width = (2 * tol / 300 * 100) + '%';
  if (err === null) { dot.style.left = '50%'; dot.style.opacity = '.28'; dot.className = 'dot'; $('#m-hint').textContent = tr('hintNone'); }
  else {
    const c = Math.max(-150, Math.min(150, err)), a = Math.abs(err);
    dot.style.opacity = '1'; dot.style.left = (50 + c / 300 * 100) + '%';
    dot.className = 'dot ' + (a <= tol ? 'ok' : a <= tol * 2 ? 'near' : 'far');
    $('#m-hint').textContent = a <= tol ? tr('hintOn') : (err < 0 ? tr('hintLow') + ' ↑' : tr('hintHigh') + ' ↓');
  }
  $('#m-det').textContent = f ? nn(Math.round(ftom(f))) : '–';
  if (hf != null) $('#m-hold').style.width = Math.min(100, hf * 100) + '%';
}

/* ---------- listening ---------- */
let run = 0;
async function listen({ target, tol, hold, timeout, my }) {
  const tf = mtof(target);
  if (demo.on) demoTarget(tf * 0.5);
  let held = 0, off = 0, noneT = 0, hist = [], frames = 0, pitched = 0, inTol = 0;
  const recent = [];
  let last = performance.now(); const start = last;
  const verdict = () => {
    if (pitched < frames * 0.12) return 'mic';
    const avg = median(recent);
    if (Math.abs(avg) <= tol || inTol > pitched * 0.25) return hold > 1 ? 'hold' : 'steady';
    return avg < 0 ? 'low' : 'high';
  };
  for (;;) {
    await sleep(40);
    if (my !== run) return { aborted:true };
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    const f = readPitch();
    let err = null, mf = null;
    frames++;
    if (f) {
      hist.push(f); if (hist.length > 5) hist.shift(); mf = median(hist); err = foldCents(mf, tf); noneT = 0;
      pitched++; recent.push(err); if (recent.length > 25) recent.shift(); if (Math.abs(err) <= tol) inTol++;
    } else { noneT += dt; if (noneT > 0.25) hist = []; }
    if (err !== null && Math.abs(err) <= tol) { held += dt; off = 0; } else { off += dt; if (off > 0.45) held = 0; }
    updateMeter(err, tol, held / hold, mf);
    if (held >= hold) { demo.freq = null; return { hit:true }; }
    if ((now - start) / 1000 >= timeout) { demo.freq = null; return { hit:false, kind:verdict() }; }
  }
}

}

const maxOf = it => it.k === 'sing' ? it.n.length : it.k === 'tap' ? it.pat.length : 1;
const flash = ok => { const s = $('#stage') || $('#qarea'); if (!s) return; s.classList.remove('flash-ok', 'flash-bad'); void s.offsetWidth; s.classList.add(ok ? 'flash-ok' : 'flash-bad'); };
const setStatus = k => { const e = $('#status'); if (e) e.textContent = tr(k); };
const testVersion = lv => { const p = P(lv.id); if (p.v === null || p.v === undefined) { p.v = (nameHash(S.name) + (p.tries || 0)) % 3; save(); } return p.v; };

SCREENS.run = ({ id, mode }) => {
  const lv = LV(id), p = P(id);
  const tag = mode === 'practice' ? (p.tier >= 3 ? tr('reviewMode') : tr('tierOf', { i:p.tier + 1 })) : tr('testVersion', { v:'ABC'[testVersion(lv)] });
  view.innerHTML = `${demoBanner()}<div class="runhead"><button class="btn ghost small" data-act="stop" data-id="${id}">${ic('x')} ${tr('stop')}</button>

  <div class="card instr"><button class="icbtn" data-act="sayInstr" aria-label="${tr('hearInstr')}">${ic('volume')}</button><div><b id="itit">${mode === 'test' ? tr('testWord') : tr('instrTitle')}</b><br><span id="itxt"></span></div></div>

};
function setInstr(text) { const e = $('#itxt'); if (e) e.textContent = text; }
function setProgress(lab, txt, pct) { const a = $('#statlab'), b = $('#stattext'), c = $('#statbar'); if (a) a.textContent = lab; if (b) b.textContent = txt; if (c) c.style.width = Math.min(100, pct) + '%'; }

async function coach(kind, text, quiet) {
  const st = $('#stage'); if (!st) return;
  const old = st.querySelector('.coach'); if (old) old.remove();
  const icn = { up:'up', down:'down', mic:'mic' }[kind] || 'target';
  st.insertAdjacentHTML('beforeend', `<div class="coach ${kind}"><div class="arrow">${ic(icn)}</div><p>${esc(text)}</p></div>`);
  if (quiet) await sleep(1300);
  else if (S.voiceOn) { await say(text); await sleep(450); } else await sleep(2800);
  const el = st.querySelector('.coach');
  if (el) { el.classList.add('out'); await sleep(320); el.remove(); }
}

async function runItem(it, mode, my, ctx) {
  window.__item = it;
  if (it.k === 'sing') return runSing(it, mode, my, ctx);
  if (it.k === 'tap') return runTap(it, mode, my, ctx);
  return runMC(it, mode, my, ctx);
}
async function announceKind(it, mode, my, ctx) {
  const kind = instrKind(it); setInstr(tr(kind));
  if (mode === 'practice' && !ctx.seen.has(kind)) { ctx.seen.add(kind); await say(tr(kind)); }
}

async function practiceSession(lv, my) {
  const p = P(lv.id), ctx = { seen:new Set(), cues:3, mic:null };
  let ti = Math.min(p.tier, 2);
  const review = p.tier >= 3;
  const head = () => { const t = lv.tiers[ti]; setProgress(review ? tr('reviewMode') : tr('tierOf', { i:ti + 1 }), review ? '∞' : p.hits + '/' + t.goal, review ? 100 : p.hits / t.goal * 100); const b = $('.badge'); if (b) b.textContent = review ? tr('reviewMode') : tr('tierOf', { i:ti + 1 }); };
  setInstr(L(lv.tiers[ti].d)); head();
  await say(L(lv.tiers[ti].d)); if (my !== run) return;
  while (my === run) {
    const t = lv.tiers[ti], it = t.g();
    await announceKind(it, 'practice', my, ctx); if (my !== run) return;
    const r = await runItem(it, 'practice', my, Object.assign(ctx, { bonus:ti === 0 ? 12 : ti === 1 ? 6 : 0 }));
    if (my !== run || r.aborted) return;
    if (!review) {
      p.hits += r.pts; save(); head();
      if (p.hits >= t.goal) {
        p.hits = 0; p.tier = ti + 1; save();
        const last = ti === 2;
        const msg = tr('beat' + (ti + 1));
        setProgress(tr('tierOf', { i:ti + 1 }), '✓', 100);
        say(msg);
        const ch = await popup({ title:tr('beat' + (ti + 1) + 't'), body:msg, btn:last ? tr('goTest') : tr('nextPractice'), btn2:last ? tr('backLevel') : null });
        if (my !== run) return;
        stopSpeech();
        if (last) { if (ch === 'main') go('run', { id:lv.id, mode:'test' }); else go('intro', { id:lv.id }); return; }
        ti++; setInstr(L(lv.tiers[ti].d)); head();
        await say(L(lv.tiers[ti].d)); if (my !== run) return;
      }
    } else head();
  }
}

async function testSession(lv, my) {
  const p = P(lv.id), v = testVersion(lv), ctx = { seen:new Set(), cues:0, mic:null, bonus:0, replays:1 };
  const items = shuf([...lv.tq.slice(v * 3, v * 3 + 3), ...lv.testGen()]);
  const total = items.reduce((a, it) => a + maxOf(it), 0);
  let pts = 0, done = 0;
  setInstr(tr('testIntro')); setProgress(tr('testWord'), '0/' + total, 0);
  await say(tr('testIntro')); if (my !== run) return;
  for (const it of items) {
    if (my !== run) return;
    await announceKind(it, 'test', my, ctx); if (my !== run) return;
    const r = await runItem(it, 'test', my, ctx);
    if (my !== run || r.aborted) return;
    pts += r.pts; done += maxOf(it);
    setProgress(tr('testWord'), done + '/' + total + '  ·  ' + pts + ' ✓', done / total * 100);
  }
  if (my !== run) return;
  const pct = Math.round(pts / total * 100), pass = pct >= lv.pass;
  p.best = Math.max(p.best, pct); p.tries = (p.tries || 0) + 1; p.v = null;
  if (pass) { p.passed = true; p.stars = Math.max(p.stars, pct === 100 ? 3 : pct >= 90 ? 2 : 1); }
  save();
  go('result', { id:lv.id, pct, pass, pts, total, v });
}

/* ---- question (multiple choice / multi-select / listening) ---- */
async function runMC(it, mode, my, ctx) {
  const qa = $('#qarea'), multi = !!it.multi, correct = new Set([].concat(it.a));
  const order = (it.ear || it.viz || it.fixed) ? it.o.map((_, i) => i) : shuf(it.o.map((_, i) => i));
  qa.innerHTML = `<div class="card qcard">${it.ear ? `<div class="stage" id="stage"><div class="orb small"><div class="core" id="bignote">${ic('headphones')}</div></div></div>` : ''}${it.viz ? kbHTML(it.viz.hi) : ''}
    <h3 class="qtext">${esc(L(it.q))}</h3>${multi ? `<p class="muted">${tr('selectAll')}</p>` : ''}
    <div class="opts" id="opts">${order.map(i => `<button class="ans" data-i="${i}" ${it.ear ? 'disabled' : ''}>${esc(L(it.o[i]))}</button>`).join('')}</div>
    <div class="row" id="qbtns">${multi ? `<button class="btn primary" id="chk" disabled>${tr('check')}</button>` : ''}${it.play ? `<button class="btn" id="rep" disabled>${ic('replay')} ${tr('hearAgain')}</button>` : ''}</div><div class="fb" id="fb"></div></div>`;
  const btns = [...qa.querySelectorAll('.ans')], chk = $('#chk'), rep = $('#rep');
  const sel = new Set();
  const setOpts = on => btns.forEach(b => { b.disabled = !on; });
  const playIt = async () => {
    setOpts(false); if (rep) rep.disabled = true; setPhase('hear');
    await playEvents(it.play.map(e => typeof e === 'number' ? e : e), my, (arr, on) => { const c = $('#bignote'); if (c) c.classList.toggle('pulse', on); });
    setPhase(null);
    if (my !== run) return;
    setOpts(true); if (rep) rep.disabled = mode === 'test' && ctx.replays <= 0 ? true : false;
  };
  if (rep) rep.onclick = async () => { if (mode === 'test') { if (ctx.replays <= 0) return; ctx.replays--; } await playIt(); if (rep && mode === 'test') rep.disabled = ctx.replays <= 0; };
  if (it.ear) { await say(L(it.q)); if (my !== run) return; if (mode === 'test') ctx.replays = 1; await playIt(); if (my !== run) return; if (rep && mode === 'test' && ctx.replays <= 0) rep.disabled = true; }
  else say(L(it.q));
  const ans = await new Promise(res => {
    answerResolve = res;
    btns.forEach(b => { b.onclick = () => {
      const i = +b.dataset.i;
      if (!multi) { res([i]); return; }
      if (sel.has(i)) { sel.delete(i); b.classList.remove('sel'); } else { sel.add(i); b.classList.add('sel'); }
      chk.disabled = sel.size === 0;
    }; });
    if (chk) chk.onclick = () => res([...sel]);
  });
  answerResolve = null;
  if (my !== run || ans === null) return { aborted:true };
  const ok = ans.length === correct.size && ans.every(i => correct.has(i));
  setOpts(false); if (chk) chk.disabled = true; if (rep) rep.disabled = true;
  btns.forEach(b => { const i = +b.dataset.i; if (ans.includes(i)) b.classList.add(ok || correct.has(i) ? 'right' : 'wrong'); else if (mode === 'practice' && !ok && correct.has(i)) b.classList.add('reveal'); });
  flash(ok);
  const fb = $('#fb');
  if (ok) { fb.textContent = tr('correct'); fb.className = 'fb good'; await sleep(900); return { pts:1, max:1 }; }
  if (mode === 'test') { fb.textContent = tr('notQuite'); fb.className = 'fb bad'; await sleep(900); return { pts:0, max:1 }; }
  const exp = it.e ? L(it.e).split('{n}').join(it.n !== undefined ? nfull(it.n) : '') : tr('rightAnswer') + ': ' + [...correct].map(i => L(it.o[i])).join(', ');
  fb.innerHTML = `<b>${tr('notQuite')}</b> ${esc(exp)}`; fb.className = 'fb bad';
  const cont = document.createElement('button'); cont.className = 'btn primary'; cont.innerHTML = tr('continueBtn') + ' ' + ic('next'); $('#qbtns').appendChild(cont);
  const clicked = new Promise(r => { cont.onclick = () => r(); });
  (async () => { await say(tr('notQuite')); if (my !== run) return; if (it.e) await sayWithNote(L(it.e), it.n); })();
  await clicked; stopSpeech();
  return { pts:0, max:1 };
}

/* ---- singing ---- */
async function runSing(it, mode, my, ctx) {
  const qa = $('#qarea'), notes = it.n, harm = typeof notes[0] !== 'number', echo = !!it.echo;
  const tol = it.tol + (mode === 'practice' ? (ctx.bonus || 0) : 0), hold = it.hold || 0.7;
  qa.innerHTML = `<div class="card stage" id="stage"><div class="status" id="status"></div><div class="orb"><div class="core" id="bignote">–</div></div>
    <div class="dots" id="dots">${notes.map(() => '<i></i>').join('')}</div>${it.lab ? `<p class="lab">${esc(L(it.lab))}</p>` : ''}${meterHTML()}
    <button class="btn small" id="rep">${ic('replay')} ${tr('hearAgain')}</button></div>`;
  if (!(await ensureMic())) return { aborted:true };
  if (my !== run) return { aborted:true };
  const rep = $('#rep'); if (mode === 'test') rep.classList.add('hidden');
  rep.onclick = () => { if (currentTarget) playTone(currentTarget.freq, 1.0); };
  const dots = () => [...document.querySelectorAll('#dots i')];
  const light = k => dots().forEach((d, j) => d.classList.toggle('on', j === k));
  const playN = e => playTone(mtof(S.root + tgt(e)), 1.0);
  if (it.lab) { await say(L(it.lab)); if (my !== run) return { aborted:true }; }
  if (echo) {
    setStatus('listen'); setPhase('hear');
    for (let i = 0; i < notes.length; i++) { light(i); $('#bignote').textContent = nn(S.root + tgt(notes[i])); await playN(notes[i]); if (my !== run) return { aborted:true }; await sleep(80); }
    light(-1); setPhase(null); $('#bignote').textContent = '?';
    if (mode === 'practice' && ctx.cues > 0) { setStatus('yourTurn'); await say(tr('yourTurn')); if (my !== run) return { aborted:true }; }
  }
  let hits = 0;
  for (let idx = 0; idx < notes.length; idx++) {
    if (my !== run) return { aborted:true };
    const e = notes[idx], t = tgt(e), m = mel(e);
    currentTarget = { freq:mtof(S.root + (harm ? m : t)) };
    light(idx); if (!echo) $('#bignote').textContent = nn(S.root + t);
    updateMeter(null, tol, 0, null);
    if (!echo) {
      setStatus('listen'); setPhase('hear');
      if (mode === 'practice' && ctx.cues > 0) { await say(tr('listen')); if (my !== run) return { aborted:true }; }
      if (harm) {
        await playTone(mtof(S.root + m), 1.1); if (my !== run) return { aborted:true };
        if (mode === 'practice') { setStatus('hearHarm'); await sleep(150); await playTone(mtof(S.root + t), 1.1); }
      } else await playN(e);
      if (my !== run) return { aborted:true };
      await sleep(100);
      if (mode === 'practice' && ctx.cues > 0) { setStatus('singNow'); await say(tr('singNow')); if (my !== run) return { aborted:true }; }
    }
    const drone = harm ? startTone(mtof(S.root + m), 0.08) : null;
    setStatus('singNow'); setPhase('sing');
    const r = await listen({ target:S.root + t, tol, hold, timeout:(mode === 'test' ? 4.5 : 8) + hold, my });
    if (drone) drone.stop();
    if (my !== run || r.aborted) return { aborted:true };
    setPhase(null);
    if (r.hit) hits++;
    ctx.cues = Math.max(0, ctx.cues - 1);
    flash(r.hit); setStatus(r.hit ? 'hit' : 'miss');
    if (r.hit) await sleep(650);
    else {
      const txt = { mic:tr('coachMic'), low:tr('coachLow'), high:tr('coachHigh'), steady:tr('coachSteady'), hold:tr('coachHold') }[r.kind] || tr('miss');
      await coach(r.kind === 'low' ? 'up' : r.kind === 'high' ? 'down' : r.kind, txt, mode === 'test');
      if (my !== run) return { aborted:true };
    }
  }
  return { pts:hits, max:notes.length };
}

/* ---- rhythm tapping ---- */
async function runTap(it, mode, my, ctx) {
  const qa = $('#qarea'), beat = 60000 / it.bpm;
  qa.innerHTML = `<div class="card stage" id="stage"><div class="status" id="status"></div>
    <div class="grid8" id="g8">${times(8, i => `<i data-c="${i}" class="${it.pat.some(o => Math.round(o * 2) === i) ? 'tgt' : ''}"></i>`).join('')}</div>
    <div class="beats" id="bts">${[1, 2, 3, 4].map(n => `<span>${n}</span>`).join('')}</div>
    <button class="tapbtn" id="tapbtn" disabled>${tr('tapBtn')}</button><p class="muted center">${tr('tapHint')}</p></div>`;
  const cells = [...document.querySelectorAll('#g8 i')], bts = [...document.querySelectorAll('#bts span')];
  const click = (accent) => { const h = startTone(mtof(S.root + (accent ? 24 : 19)), 0.2); setTimeout(() => h.stop(), 70); };
  const cur = k => { cells.forEach((c, j) => c.classList.toggle('cur', j === k)); bts.forEach((s, j) => s.classList.toggle('on', k >= 0 && j === Math.floor(k / 2) && k % 2 === 0)); };
  // 1) hear it
  setStatus('tapListen'); setPhase('hear'); muted = true;
  let t0 = performance.now();
  for (const o of it.pat) {
    const wait = t0 + o * beat - performance.now(); if (wait > 0) await sleep(wait);
    if (my !== run) { muted = false; return { aborted:true }; }
    const h = startTone(mtof(S.root + 7), 0.22); cur(Math.round(o * 2)); setTimeout(() => h.stop(), 140);
  }
  await sleep(beat * 0.8); cur(-1); setPhase(null);
  // 2) count in
  setStatus('tapCount');
  for (let k = 0; k < 4; k++) { if (my !== run) { muted = false; return { aborted:true }; } click(k === 0); bts.forEach((s, j) => s.classList.toggle('on', j === k)); await sleep(beat); }
  // 3) tap
  muted = false; setStatus('tapNow'); setPhase('sing');
  const btn = $('#tapbtn'), taps = []; btn.disabled = false;
  t0 = performance.now();
  btn.onpointerdown = ev => { ev.preventDefault(); taps.push(performance.now() - t0); btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 90); };
  const simulated = demo.on ? it.pat.map(o => o * beat + (Math.random() - .5) * beat * 0.3) : null;
  let simI = 0;
  const endT = t0 + 4 * beat + beat * 0.5;
  let lastB = -1;
  while (performance.now() < endT) {
    if (my !== run) return { aborted:true };
    const el = performance.now() - t0, b2 = Math.floor(el / beat);
    if (b2 !== lastB && b2 < 4) { lastB = b2; click(b2 === 0); bts.forEach((s, j) => s.classList.toggle('on', j === b2)); }
    cur(Math.min(7, Math.floor(el / (beat / 2))));
    while (simulated && simI < simulated.length && el >= simulated[simI]) { taps.push(simulated[simI]); simI++; btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 90); }
    await sleep(15);
  }
  btn.disabled = true; btn.onpointerdown = null; cur(-1); setPhase(null);
  // score
  const win = beat * (mode === 'test' ? 0.28 : 0.36), used = new Set(); let matches = 0;
  it.pat.forEach((o, k) => {
    let best = -1, bd = 1e9;
    taps.forEach((tp, j) => { if (used.has(j)) return; const d = Math.abs(tp - o * beat); if (d < bd) { bd = d; best = j; } });
    const c = cells[Math.round(o * 2)];
    if (best >= 0 && bd <= win) { used.add(best); matches++; if (c) c.classList.add('good'); } else if (c) c.classList.add('bad');
  });
  const extras = Math.max(0, taps.length - matches);
  const pts = Math.max(0, matches - Math.max(0, extras - 1)), ok = pts >= it.pat.length;
  flash(pts >= it.pat.length * 0.7); setStatus(ok ? 'tapGood' : 'tapOff');
  if (!ok && mode === 'practice') { await say(tr('tapOff')); } else await sleep(1100);
  return { pts, max:it.pat.length };
}

/* warm-up */
const WARM = ['breathe', 'hum', 'siren', 'scale'];
SCREENS.warmup = ({ step = 0 } = {}) => {
  const keys = { breathe:['wBreatheT', 'wBreatheB'], hum:['wHumT', 'wHumB'], siren:['wSirenT', 'wSirenB'], scale:['wScaleT', 'wScaleB'] };
  if (step >= WARM.length) {
    S.warmDone++; save();
    view.innerHTML = `<div class="card hero"><div class="big-ic good">${ic('flame')}</div><h2 class="center">${tr('wDone')}</h2></div>
      <button class="btn primary big" data-go="levels">${tr('levels')} ${ic('next')}</button><button class="btn ghost big" data-go="home">${tr('back')}</button>`;
    confetti(); say(tr('wDone'));
    return;
  }
  const k = WARM[step], vis = {
    breathe:'<div class="breath" id="vis"></div>',
    hum:`<div class="hum-ic" id="vis">${ic('mic')}</div>`,
    siren:'<div class="track"><div class="ball" id="vis"></div></div>',
    scale:`<div class="chips" id="vis" style="justify-content:center">${[0, 2, 4, 5, 7].map(o => `<span class="chip">${nn(S.root + o)}</span>`).join('')}</div>`
  }[k];
  view.innerHTML = `<h2>${tr('wTitle')}</h2>
    <div class="wdots">${WARM.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card hero slide"><h3>${tr(keys[k][0])}</h3><p>${tr(keys[k][1])}</p>${vis}<div class="status center" id="status"></div></div>
    <div class="row"><button class="btn primary" id="wgo" data-act="wrun" data-step="${step}">${ic('play')} ${tr('wStart')}</button>
    <button class="btn" data-act="wnext" data-step="${step}">${step === WARM.length - 1 ? tr('wFinish') : tr('wNext')} ${ic('next')}</button></div>`;
  say(tr(keys[k][0]) + '. ' + tr(keys[k][1]));
};
async function warmRun(step) {
  stopSpeech();
  const my = ++run, k = WARM[step], st = m => { const e = $('#status'); if (e) e.textContent = m; };
  $('#wgo').disabled = true;
  if (k === 'breathe') {
    const b = $('#vis');
    for (let c = 0; c < 3; c++) {
      st(tr('wIn')); b.classList.add('big'); await sleep(4000); if (my !== run) return;
      st(tr('wHold')); await sleep(2000); if (my !== run) return;
      st(tr('wOut')); b.classList.remove('big'); await sleep(4000); if (my !== run) return;
    }
  } else if (k === 'hum') {
    st(tr('wListen')); await playTone(mtof(S.root), 2.5); if (my !== run) return;
    st(tr('wHum')); const h = $('#vis'); if (h) h.classList.add('pulse');
    await sleep(10000); if (my !== run) return;
    if (h) h.classList.remove('pulse');
  } else if (k === 'siren') {
    const ac = audio(), h = startTone(mtof(S.root), 0.22), n = ac.currentTime;
    muted = true;
    h.osc.frequency.setValueAtTime(mtof(S.root), n);
    h.osc.frequency.exponentialRampToValueAtTime(mtof(S.root + 12), n + 4);
    h.osc.frequency.exponentialRampToValueAtTime(mtof(S.root), n + 8);
    st(tr('wSiren')); const ball = $('#vis');
    requestAnimationFrame(() => ball.classList.add('up'));
    await sleep(4000); if (my !== run) return; ball.classList.remove('up');
    await sleep(4000); h.stop(); muted = false;
  } else if (k === 'scale') {
    const chips = document.querySelectorAll('#vis .chip'), seq = [0, 2, 4, 5, 7, 5, 4, 2, 0], idx = [0, 1, 2, 3, 4, 3, 2, 1, 0];
    st(tr('wListen'));
    for (let pass = 0; pass < 2; pass++) for (let i = 0; i < seq.length; i++) {
      if (my !== run) return;
      chips.forEach((c, j) => c.classList.toggle('on', j === idx[i]));
      await playTone(mtof(S.root + seq[i]), 0.7);
    }
    chips.forEach(c => c.classList.remove('on'));
  }
  if (my === run) { st('✓'); const g = $('#wgo'); if (g) g.disabled = false; }
}

/* range finder: guided four-step test (lowest, highest, sweet spot low edge, sweet spot high edge) */
const VT = {
  bass:{ n:b('Bass', 'Bajo'), d:b('Bass. The lowest male voice type. Your sweet spot sits low, so you sound rich and deep. Basses anchor the bottom of a harmony and give the whole team a foundation.', 'Bajo. El tipo de voz masculina más grave. Tu punto ideal está abajo, así que suenas profundo y lleno. Los bajos sostienen la base de la armonía y le dan cimiento a todo el equipo.') },
  baritone:{ n:b('Baritone', 'Barítono'), d:b('Baritone. The middle male voice type, and the most common one. Your sweet spot sits in the middle, so you can comfortably sing many melodies, or the harmony below them.', 'Barítono. El tipo de voz masculina intermedia, y el más común. Tu punto ideal está en el medio, así que puedes cantar con comodidad muchas melodías, o la armonía por debajo de ellas.') },
  tenor:{ n:b('Tenor', 'Tenor'), d:b('Tenor. The higher male voice type. Your sweet spot sits fairly high, so you sound bright and clear on melodies and on upper harmonies.', 'Tenor. El tipo de voz masculina más aguda. Tu punto ideal está bastante arriba, así que suenas brillante y claro en las melodías y en las armonías agudas.') },
  alto:{ n:b('Alto', 'Contralto'), d:b('Alto. The lower female voice type. Your sweet spot sits lower, so you sound warm and full, and you are great for harmony parts below the melody. Very low female voices are sometimes called contralto.', 'Contralto. El tipo de voz femenina más grave. Tu punto ideal está más abajo, así que suenas cálida y llena, y eres excelente para las partes de armonía debajo de la melodía.') },
  mezzo:{ n:b('Mezzo-soprano', 'Mezzosoprano'), d:b('Mezzo soprano. The middle female voice type. Your sweet spot sits in the middle, so you can sing melodies or harmony comfortably.', 'Mezzosoprano. El tipo de voz femenina intermedia. Tu punto ideal está en el medio, así que puedes cantar melodías o armonías con comodidad.') },
  soprano:{ n:b('Soprano', 'Soprano'), d:b('Soprano. The highest female voice type. Your sweet spot sits high, so you sound bright and clear on top melodies and high harmonies.', 'Soprano. El tipo de voz femenina más aguda. Tu punto ideal está arriba, así que suenas brillante y clara en las melodías altas y en las armonías agudas.') }
};
let RG = null;
const rgNew = () => (RG = { low:null, high:null, pLow:null, pHigh:null, mark:false });
const classify = (a, c) => { const m = (a + c) / 2; return m < 50 ? 'bass' : m < 55 ? 'baritone' : m < 60 ? 'tenor' : m < 64 ? 'alto' : m < 68 ? 'mezzo' : 'soprano'; };
const RSTAGE = { low:1, high:2, plow:3, phigh:4 };

SCREENS.range = ({ phase = 'intro' } = {}) => {
  if (phase === 'intro') {
    rgNew();
    const r = S.range && S.range.pLow;
    view.innerHTML = `<div class="card hero"><div class="big-ic">${ic('ruler')}</div><h2 class="center">${tr('rTitle')}</h2><p class="center muted">${tr('rIntro')}</p><p class="tip">${tr('rAdult')}</p>
      ${r ? `<p class="muted center">${tr('rResult')}: ${nnOct(S.range.low)} – ${nnOct(S.range.high)} · ${tr('rSweetLab')}: ${nnOct(S.range.pLow)} – ${nnOct(S.range.pHigh)}</p>` : ''}</div>
      <button class="btn primary big" data-act="rstart">${tr('rBegin')} ${ic('next')}</button>`;
    const my = run;
    say(tr('rTitle') + '. ' + tr('rIntro')).then(() => { if (my === run) say(tr('rAdult')); });
  } else if (RSTAGE[phase]) {
    if (!RG) rgNew();
    const n = RSTAGE[phase];
    view.innerHTML = `${demoBanner()}<div class="runhead"><button class="btn ghost small" data-go="range">${ic('x')} ${tr('stop')}</button><span class="badge practice">${n} / 4</span></div>
      <div class="card stage" id="stage"><h3>${tr('rStage' + n + 'T')}</h3><p class="muted">${tr('rStage' + n)}</p><div class="status" id="status"></div>
      <div class="orb"><div class="core" id="bignote">–</div></div><p class="center muted">${tr('youSing')}: <b id="sung">–</b></p>
      <button class="btn primary big" data-act="rmark">${tr(n <= 2 ? (n === 1 ? 'rBtnLow' : 'rBtnHigh') : 'rBtnWork')}</button></div>
      <div id="micbox" class="card hidden"><p>${tr('micProblem')}</p><div class="row"><button class="btn primary" data-act="demoOn">${tr('useDemo')}</button></div></div>`;
    rangeStage(phase);
  } else {
    const r = S.range, lo = 36, hi = 90, pos = m => ((Math.max(lo, Math.min(hi, m)) - lo) / (hi - lo) * 100).toFixed(1);
    const vt = VT[r.type], size = r.pHigh - r.pLow + 1;
    view.innerHTML = `<div class="card hero"><div class="big-ic good">${ic('check')}</div><h2 class="center">${tr('rDoneT')}</h2>
      <div class="rbar"><i class="rr" style="left:${pos(r.low)}%;width:${(pos(r.high) - pos(r.low)).toFixed(1)}%"></i><i class="rs" style="left:${pos(r.pLow)}%;width:${(pos(r.pHigh) - pos(r.pLow)).toFixed(1)}%"></i></div>
      <p class="muted"><span class="dotb"></span> ${tr('rRangeLab')}: <b>${nnOct(r.low)} – ${nnOct(r.high)}</b></p>
      <p class="muted"><span class="dotg"></span> ${tr('rSweetLab')}: <b>${nnOct(r.pLow)} – ${nnOct(r.pHigh)}</b> (${size} ${tr('rNotes')})</p>
      <div class="score" style="font-size:38px">${esc(L(vt.n))}</div><p>${esc(L(vt.d))}</p><p class="tip">${tr('rNotExact')}</p><p class="center">${tr('rSaved')} <b>${nnOct(S.root)}</b></p></div>
      <button class="btn primary big" data-go="levels">${tr('levels')} ${ic('next')}</button><button class="btn big" data-act="rstart">${tr('rRetry')}</button>`;
    confetti();
    const my = run;
    say(tr('rResultSay')).then(() => { if (my === run) return say(L(vt.d)); }).then(() => { if (my === run) say(tr('rNotExact')); });
  }
};

async function sampleSung(ms, my, stopOnMark) {
  const vals = [], t0 = performance.now();
  while (performance.now() - t0 < ms) {
    await sleep(40); if (my !== run) return null;
    if (stopOnMark && RG && RG.mark) break;
    const f = readPitch();
    if (f) { vals.push(ftom(f)); const e = $('#sung'); if (e) e.textContent = nnOct(ftom(f)); }
  }
  const v = vals.slice(Math.floor(vals.length * 0.35));
  if (v.length < 10) return null;
  const m = median(v);
  if (v.filter(x => Math.abs(x - m) < 1.2).length < v.length * 0.6) return null;
  return m;
}
const demoSing = p => { if (!demo.on) return; if (p >= 41 && p <= 79) demoTarget(mtof(p), false); else demo.freq = null; demo.t0 = performance.now(); };

async function rangeStage(phase) {
  const my = run;
  if (!(await ensureMic()) || my !== run) return;
  const n = RSTAGE[phase];
  await say(tr('rStage' + n + 'T') + '. ' + tr('rStage' + n)); if (my !== run) return;
  RG.mark = false;
  const dir = (phase === 'low' || phase === 'plow') ? -1 : 1;
  if (n <= 2) {
    let p = phase === 'low' ? 69 : Math.round(RG.low + 8), last = null, misses = 0, first = true;
    for (let steps = 0; steps < 45 && my === run; steps++) {
      if (RG.mark) break;
      $('#bignote').textContent = nnOct(p); setStatus('rPlaying'); setPhase('hear');
      await playTone(mtof(p), 0.9); if (my !== run) return;
      setStatus('rSingAlong'); setPhase('sing'); demoSing(p);
      const m = await sampleSung(2300, my, true); if (my !== run) return;
      demo.freq = null; setPhase(null);
      const ok = m !== null && (first ? Math.abs((((m - p + 6) % 12) + 12) % 12 - 6) <= 1.3 : Math.abs(m - p) <= 1.5);
      if (ok) { last = Math.round(m); misses = 0; first = false; setStatus('rGotNote'); await sleep(250); p = last + dir; }
      else { if (RG.mark) break; misses++; if (misses >= 2) break; setStatus('rRetryNote'); await sleep(900); }
    }
    if (my !== run) return;
    const bad = last === null || (phase === 'high' && last <= RG.low + 3);
    if (bad) { setStatus('rFail'); setPhase(null); await say(tr('rFail')); return; }
    RG[phase] = last;
    setStatus('rGotNote'); await sleep(900); if (my !== run) return;
    go('range', { phase:phase === 'low' ? 'high' : 'plow' });
  } else {
    const span = RG.high - RG.low, end = dir < 0 ? RG.low + 1 : RG.high - 1;
    let p = Math.round(RG.low + span * (dir < 0 ? 0.62 : 0.3)), edge = end;
    for (let steps = 0; steps < 45 && my === run; steps++) {
      $('#bignote').textContent = nnOct(p); setStatus('rPlaying'); setPhase('hear');
      await playTone(mtof(p), 0.8); if (my !== run) return;
      setStatus('rSingAlong'); setPhase('sing'); demoSing(p);
      if (demo.on && ((dir < 0 && p <= RG.low + span * 0.3) || (dir > 0 && p >= RG.low + span * 0.72))) RG.mark = true;
      await sampleSung(2000, my, true); if (my !== run) return;
      demo.freq = null; setPhase(null);
      if (RG.mark) { edge = p; break; }
      if ((dir < 0 && p <= end) || (dir > 0 && p >= end)) { edge = end; break; }
      p += dir;
    }
    if (my !== run) return;
    RG[phase === 'plow' ? 'pLow' : 'pHigh'] = edge; setStatus('rGotNote'); await sleep(800); if (my !== run) return;
    if (phase === 'plow') go('range', { phase:'phigh' }); else finishRange();
  }
}
function finishRange() {
  let { low, high, pLow, pHigh } = RG;
  if (pLow > pHigh) [pLow, pHigh] = [pHigh, pLow];
  pLow = Math.max(low, pLow); pHigh = Math.min(high, pHigh);
  if (pHigh - pLow < 5) pHigh = Math.min(high, pLow + 12);
  const type = classify(pLow, pHigh);
  const target = pLow + (pHigh - pLow) * 0.2, roots = [36, 48, 60];
  S.root = roots.reduce((a, c) => Math.abs(c - target) < Math.abs(a - target) ? c : a);
  S.voice = (pLow + pHigh) / 2 < 60 ? 'low' : 'high';
  S.range = { low, high, pLow, pHigh, type }; save();
  go('range', { phase:'done' });
}

SCREENS.theory = () => {
  view.innerHTML = `<h2>${tr('tTitle')}</h2><p class="muted">${tr('tIntro')}</p>` + THEORY.map((t, i) =>
    `<details><summary>${esc(L(t.k))}</summary><p>${esc(L(t.d))}</p><div class="row"><button class="btn small" data-act="tsay" data-i="${i}">${ic('volume')} ${tr('tRead')}</button>${t.demo ? `<button class="btn small" data-act="tplay" data-i="${i}">${ic('play')} ${tr('tPlay')}</button>` : ''}</div></details>`).join('');
};
SCREENS.progress = () => {
  const N = LEVELS.length, stars = LEVELS.reduce((a, l) => a + P(l.id).stars, 0), passed = LEVELS.filter(l => P(l.id).passed).length;
  view.innerHTML = `<h2>${tr('progress')}</h2>
    <div class="grid"><div class="card"><div class="score" style="font-size:40px">${stars}/${N * 3}</div><p class="muted center">${tr('pStars')}</p></div>

    SECTIONS.map(sec => `<p class="eyebrow" style="margin-top:16px">${tr('secWord', { n:sec.id })} · ${esc(L(sec.name))}</p>` + levelsOfSec(sec.id).map(l => { const p = P(l.id); return `<div class="lv ${p.passed ? 'passed' : ''}" style="cursor:default"><span class="num">${l.id}</span><span class="nm">${esc(L(l.name))}<small>${p.best ? tr('pBest') + ': ' + p.best + '% · ' + tr('pTries') + ': ' + (p.tries || 0) : '–'}</small></span>${starsHTML(p.stars)}</div>`; }).join('')).join('');
};
let resetArmed = false;
SCREENS.settings = () => {
  view.innerHTML = `<h2>${tr('settings')}</h2>
  <div class="card"><h3>${tr('sName')}</h3><input type="text" id="nm" value="${esc(S.name)}"></div>
  <div class="card"><h3>${tr('sLang')}</h3><div class="row"><button class="btn ${S.lang === 'en' ? 'primary' : ''}" data-lang="en">English</button><button class="btn ${S.lang === 'es' ? 'primary' : ''}" data-lang="es">Español</button></div></div>
  <div class="card"><h3>${tr('sVoice')}</h3>
    <button class="opt ${S.voice === 'low' ? 'on' : ''}" data-act="setvoice" data-v="low"><b>${tr('voiceLow')}</b><small>${tr('voiceLowSub')}</small></button>
    <button class="opt ${S.voice === 'high' ? 'on' : ''}" data-act="setvoice" data-v="high"><b>${tr('voiceHigh')}</b><small>${tr('voiceHighSub')}</small></button>
    <p class="muted">${tr('sStart')}: <b>${nnOct(S.root)}</b></p></div>
  <div class="card"><h3>${tr('sRead')}</h3><button class="opt ${S.voiceOn ? 'on' : ''}" data-act="voiceToggle"><b>${S.voiceOn ? tr('sOn') : tr('sOff')}</b></button>
    <p class="muted" style="margin-top:12px">${tr('sSpeed')}</p><input type="range" id="ratesel" min="0.8" max="1.2" step="0.05" value="${S.rate}">
    <div class="ends"><span>${tr('sSlow')}</span><span>${tr('sFast')}</span></div>
    <div class="row"><button class="btn" data-act="prevVoice">${ic('volume')} ${tr('sPreview')}</button></div>
    <p class="muted">${tr('sVoiceTip')}</p></div>
  <div class="card"><h3>${tr('sDemo')}</h3><button class="opt ${demo.on ? 'on' : ''}" data-act="demoToggle"><b>${demo.on ? tr('sOn') : tr('sOff')}</b></button></div>
  <button class="btn big" data-go="tour">${ic('gauge')} ${tr('sTour')}</button>
  <button class="btn ghost big" data-act="reset">${resetArmed ? tr('sConfirm') : tr('sReset')}</button>`;
};

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  audio();
  const l = ev.target.closest('[data-lang]');
  if (l) { S.lang = l.dataset.lang; save(); stopSpeech(); render(); return; }
  const g = ev.target.closest('[data-go]');
  if (g && !g.disabled) { go(g.dataset.go, g.dataset.id ? { id:+g.dataset.id } : {}); return; }
  const a = ev.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const d = a.dataset;
  switch (d.act) {
    case 'pickLang': S.lang = d.v; save(); go('onboard', { step:'name' }); break;
    case 'obName': { const n = $('#nm'); S.name = n ? n.value.trim() : ''; save(); go('onboard', { step:'voice' }); break; }
    case 'obVoice': S.voice = d.v === 'high' ? 'high' : 'low'; S.root = S.voice === 'low' ? 48 : 60; S.unsure = d.v === 'unsure'; save(); go('onboard', { step:'read' }); break;
    case 'obRead': S.voiceOn = d.v === 'yes'; S.onboardDone = true; save(); go('tour', { i:0 }); break;
    case 'tourGo': go('tour', { i:+d.i, dir:+d.dir }); break;
    case 'tourSay': say(L(TOUR[+d.i].t) + '. ' + L(TOUR[+d.i].d), true); break;
    case 'tourSkip': S.tourDone = true; save(); go('home'); break;
    case 'tourEnd': S.tourDone = true; save(); if (d.to === 'range') go('range', { phase:'intro' }); else go('intro', { id:1 }); break;
    case 'voiceToggle': S.voiceOn = !S.voiceOn; save(); if (!S.voiceOn) stopSpeech(); render(); break;
    case 'setvoice': S.voice = d.v; S.root = d.v === 'low' ? 48 : 60; S.range = null; save(); render(); break;
    case 'start': go('run', { id:+d.id, mode:d.mode }); break;
    case 'stop': go('intro', { id:+d.id }); break;
    case 'lesson': go('lesson', { id:+d.id, i:0 }); break;
    case 'lpage': go('lesson', { id:+d.id, i:+d.i }); break;
    case 'lfinish': { const p = P(+d.id); p.lessonDone = true; save(); go('run', { id:+d.id, mode:'practice' }); break; }
    case 'lsay': { const lv = LV(cur.args.id), pg = lv.lesson[cur.args.i || 0]; say(L(pg.t) + '. ' + L(pg.b), true); break; }
    case 'lplay': { const lv = LV(cur.args.id), pg = lv.lesson[cur.args.i || 0]; stopSpeech(); const my = ++run; playEvents(pg.play, my, (arr, on) => kbLight(arr, on)); break; }
    case 'readDesc': { const lv = LV(+d.id); say(L(lv.name) + '. ' + L(lv.desc), true); break; }
    case 'secsay': { const sc = SECTIONS.find(s => s.id === +d.id); say(L(sc.name) + '. ' + L(sc.desc), true); break; }
    case 'sayInstr': { const e = $('#itxt'); if (e) say(e.textContent, true); break; }
    case 'demoOn': demo.on = true; go(cur.name, cur.args); break;
    case 'demoToggle': demo.on = !demo.on; render(); break;
    case 'wrun': warmRun(+d.step); break;
    case 'wnext': go('warmup', { step:+d.step + 1 }); break;
    case 'rstart': go('range', { phase:'low' }); break;
    case 'rmark': if (RG) RG.mark = true; break;
    case 'tsay': { const t = THEORY[+d.i]; say(L(t.k) + '. ' + L(t.d), true); break; }
    case 'tplay': { stopSpeech(); const my = ++run; playEvents(THEORY[+d.i].demo, my, null); break; }
    case 'prevVoice': say(tr('sPreviewText'), true); break;
    case 'reset': if (resetArmed) { S.progress = {}; S.warmDone = 0; S.range = null; save(); resetArmed = false; go('home'); } else { resetArmed = true; render(); } break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'nm' && cur.name === 'settings') { S.name = ev.target.value; save(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'ratesel') { S.rate = +ev.target.value; save(); say(tr('sPreviewText'), true); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'nm' && cur.name === 'onboard') { ev.preventDefault(); const b = $('[data-act=obName]'); if (b) b.click(); }
});

/* ---------- every phrase the app can speak (used to record the voice) ---------- */
const SPOKEN_TXT = ['listen', 'singNow', 'yourTurn', 'correct', 'notQuite', 'selectAll', 'coachMic', 'coachLow', 'coachHigh', 'coachSteady', 'coachHold', 'beat1', 'beat2', 'beat3', 'passedSay', 'failSay2', 'instrSing', 'instrEcho', 'instrMC', 'instrEar', 'instrTap', 'instrHarm', 'testIntro', 'tapOff', 'wDone', 'qName', 'qVoice', 'qRead', 'rAdult', 'rResultSay', 'rNotExact', 'rRetryNote', 'rFail', 'rSaved', 'sPreviewText', 'wBreatheT', 'wBreatheB', 'wHumT', 'wHumB', 'wSirenT', 'wSirenB', 'wScaleT', 'wScaleB'];
function allSpeech() {
  const out = [], seen = new Set(), keep = S.lang;
  const add = (pack, text) => { const t = cleanSpeech(text); if (!t) return; const k = S.lang + '|' + t; if (seen.has(k)) return; seen.add(k); out.push({ lang:S.lang, pack:S.lang + '_' + pack, text:t, key:clipKey(S.lang, t) }); };
  for (const lang of ['en', 'es']) {
    S.lang = lang;
    SPOKEN_TXT.forEach(k => add('ui', tr(k)));
    add('ui', tr('rTitle') + '. ' + tr('rIntro'));
    for (let i = 1; i <= 4; i++) add('ui', tr('rStage' + i + 'T') + '. ' + tr('rStage' + i));
    Object.values(VT).forEach(v => add('ui', L(v.d)));
    ['wBreatheT', 'wHumT', 'wSirenT', 'wScaleT'].forEach(k => add('ui', tr(k) + '. ' + tr(k.slice(0, -1) + 'B')));
    TOUR.forEach(s => add('ui', L(s.t) + '. ' + L(s.d)));
    THEORY.forEach(g => add('ui', L(g.k) + '. ' + L(g.d)));
    SECTIONS.forEach(s => add('ui', L(s.name) + '. ' + L(s.desc)));
    for (let m = 0; m < 12; m++) add('ui', solfSay(m));
    LEVELS.forEach(lv => {
      const pk_ = 'L' + lv.id;
      add(pk_, L(lv.name) + '. ' + L(lv.desc));
      lv.lesson.forEach(pg => add(pk_, L(pg.t) + '. ' + L(pg.b)));
      lv.tiers.forEach(t => add(pk_, L(t.d)));
      const itemTxt = it => {
        if (it.k === 'mc') { add(pk_, L(it.q)); if (it.e) { const e = L(it.e); if (e.indexOf('{n}') >= 0) { const parts = e.split('{n}'); add(pk_, parts[0]); if (parts[1] && parts[1].replace(/[.\s]/g, '')) add(pk_, parts[1]); } else add(pk_, e); } }
        if (it.k === 'sing' && it.lab) add(pk_, L(it.lab));
      };
      lv.pq.forEach(itemTxt); lv.tq.forEach(itemTxt);
      for (let n = 0; n < 250; n++) { lv.tiers.forEach(t => itemTxt(t.g())); lv.testGen().forEach(itemTxt); }
    });
  }
  S.lang = keep;
  return out;
}

load();
go(S.onboardDone ? 'home' : 'onboard');
